[pytest]
testpaths = tests
python_files = test_*.py

# 显式声明 asyncio 模式，不依赖 pytest-asyncio 的默认值 ——
# 默认值在 0.21/0.23/0.24 之间变过，升级依赖时会静默改变行为。
# strict 要求异步测试带 @pytest.mark.asyncio 标记，
# 比 auto 更清晰：一眼能看出哪些测试是异步的。
asyncio_mode = strict

filterwarnings =
    # transformers 与 swig 的弃用警告与本项目无关，压掉以免刷屏
    ignore::FutureWarning:transformers.*
    ignore::DeprecationWarning:importlib._bootstrap
