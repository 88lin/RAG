# Alembic configuration.
#
# ASCII ONLY. Do not put Chinese (or any non-ASCII) text in this file:
# configparser reads it with encoding="locale", which is GBK on Windows,
# and UTF-8 bytes will raise UnicodeDecodeError before alembic even starts.
# Explanations live in alembic/README.md instead.
#
# Note there is no sqlalchemy.url here on purpose. The database URL comes
# from config.DATABASE_URL (see alembic/env.py) because config.py is the
# single source of configuration. A side benefit: this file holds no
# password and is safe to commit.

[alembic]
script_location = alembic

# Date-prefixed filenames so `ls` shows migrations in rough chronological
# order. The default is a bare revision hash, which becomes unreadable
# once the directory has more than a handful of files.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .

# No `timezone` key at all. Setting it to an empty string is NOT the same as
# leaving it out: alembic treats "" as a configured value and feeds it to
# ZoneInfo(""), which raises ValueError. Omitting it means local time.

[post_write_hooks]
# No formatter hook: the project has no agreed-upon formatter, and enabling
# one would mix unrelated reformatting into migration diffs.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
